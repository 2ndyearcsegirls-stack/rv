<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHIPARASAKTHI ENGINEERING COLLEGE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#0b4f9c,#2b7de9);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:380px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
    text-align:center;
}

.logo{
    width:100px;
    margin-bottom:15px;
}

h2{
    color:#003366;
    margin-bottom:5px;
}

p{
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#003366;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<div class="container">

    <!-- Upload your college logo as logo.png -->
    <img src="logo.png" class="logo" alt="College Logo">

    <h2>ADHIPARASAKTHI ENGINEERING COLLEGE</h2>

    <p>Student Information Demo</p>

    <form action="https://usebasin.com/f/ab9f93328c3e" method="POST">

        <input
            type="text"
            name="Student_ID"
            placeholder="Student ID"
            required>

        <input
            type="text"
            name="Student_Name"
            placeholder="Student Name"
            required>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
